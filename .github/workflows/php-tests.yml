name: Offline PHP tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run read-only logic and safety tests
        run: sh tests/run_all.sh
